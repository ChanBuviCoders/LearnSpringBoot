# ============================================================
# DATABASE - Azure SQL / Render
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

# Keep existing database column/table naming
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ============================================================
# SERVER
# ============================================================

server.address=0.0.0.0
server.port=${PORT:8888}


# ============================================================
# SPRING SECURITY
# ============================================================

spring.security.user.name=${SECURITY_USERNAME:chandranBE}
spring.security.user.password=${SECURITY_PASSWORD}


# ============================================================
# EMAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# CLIENT DOCUMENTS - QA PATHS
# ============================================================

# QA: Use environment variables for cloud testing paths
app.client.documents.base-path=${CLIENT_DOCS_PATH:/app/qa/documents}
app.client.documents.api-path=${CLIENT_DOCS_API_PATH:/app/qa/documents/apiDocuments}
app.client.documents.client-path=${CLIENT_DOCS_CLIENT_PATH:/app/qa/documents/clientDocuments}


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

