# ============================================================
# COMMON JPA / HIBERNATE
# ============================================================
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Hibernate naming strategy (Compatible with Spring Boot 3 / Hibernate 6)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============================================================
# EMAIL
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true

# ============================================================
# FILE UPLOAD (Safe limits for production)
# ============================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.path=./documents/apiDocuments
app.upload.max-file-size=15

# Client Documents Configuration - Server Level
app.client.documents.base-path=${CLIENT_DOCS_PATH:./documents}
app.client.documents.api-path=${CLIENT_DOCS_API_PATH:${app.client.documents.base-path}/apiDocuments}
app.client.documents.client-path=${CLIENT_DOCS_CLIENT_PATH:${app.client.documents.base-path}/clientDocuments}

# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:4200
app.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
app.jwt.expiration=${JWT_EXPIRATION:864000000}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=INFO
logging.level.config=DEBUG
logging.level.org.springframework=INFO
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application
logging.file.max-size=10MB
logging.file.max-history=10

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-stacktrace=never

# ============================================================
# CONNECTION POOL (HikariCP)
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

