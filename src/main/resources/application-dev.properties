# ============================================================

# DEVELOPMENT DATABASE - LOCAL SQL SERVER

# ============================================================

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=financial_management;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# ============================================================

# SERVER

# ============================================================

server.port=8888

# ============================================================

# SPRING SECURITY

# ============================================================

spring.security.user.name=${SECURITY_USERNAME:financialAdmin}
spring.security.user.password=${SECURITY_PASSWORD}

# ============================================================

# EMAIL

# ============================================================

spring.mail.username=YOUR_MAIL_USERNAME
spring.mail.password=YOUR_MAIL_PASSWORD

# ============================================================
# CLIENT DOCUMENTS - DEVELOPMENT PATHS
# ============================================================
app.client.documents.base-path=./documents
app.client.documents.api-path=./documents/apiDocuments
app.client.documents.client-path=./documents/clientDocuments

# Azure (prefer env var AZURE_STORAGE_CONNECTION_STRING)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:fullstackstoragecontainer}
