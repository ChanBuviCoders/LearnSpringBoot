# ============================================================
# PRODUCTION DATABASE - AZURE SQL
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Production DDL Override (Safeguard database schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# HikariCP Pool Tuning for Azure SQL & Render RAM Limits
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# SERVER - RENDER
# ============================================================
server.address=0.0.0.0
server.port=${PORT:8888}

# ============================================================
# SPRING SECURITY & MAIL CREDENTIALS
# ============================================================
spring.security.user.name=${SECURITY_USERNAME:chandranBE}
spring.security.user.password=${SECURITY_PASSWORD}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
